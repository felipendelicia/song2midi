[project]
name = "song2midi"
version = "0.1.0"
description = "Transcribe a full song into a multitrack MIDI file"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "soundfile",
    "librosa",
    "pretty_midi",
]

[project.optional-dependencies]
gpu = []

[project.scripts]
song2midi = "song2midi.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: loads models or processes real audio"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["song2midi"]
