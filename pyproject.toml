[project]
name = "song2midi"
version = "0.1.0"
description = "Transcribe a full song into a multitrack MIDI file"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "soundfile",
    "librosa",
    "pretty_midi",
    "basic-pitch[onnx]>=0.4.0",
    "setuptools<81",
    "demucs>=4.1.0",
    "torchcrepe>=0.0.24",
    "beat-this>=1.1.0",
    "psutil>=5.9",
    "platformdirs>=4.11.0",
]

[tool.uv]
# basic-pitch 0.4.0 hard-requires TensorFlow on Linux/py3.11, but it selects its
# backend with a try/except at import time and ships an ONNX copy of the model.
# With TF absent it uses onnxruntime, which is ~2 GB smaller and loads faster.
override-dependencies = ["tensorflow; sys_platform == 'never'"]
# resampy <0.4.3 (pinned by basic-pitch) imports pkg_resources, removed in
# setuptools 81.
constraint-dependencies = ["setuptools<81"]
# demucs caps torch at <2.3 on Intel Macs only. Resolving for that platform
# drags the whole project back to torch 2.2; exclude it rather than pin everyone
# else to a 2024 release. Apple Silicon, Linux and Windows are unaffected.
environments = ["sys_platform != 'darwin' or platform_machine != 'x86_64'"]

# One of these two is always active, never both. `default-groups` is what keeps
# a bare `uv sync --locked` - CI on both runners, and scripts/setup-windows.ps1
# - on the CPU wheels with no flags at all. It replaces uv's default of ["dev"],
# so "dev" has to be listed again or pytest disappears.
conflicts = [[{ group = "cpu" }, { group = "cu126" }]]
default-groups = ["dev", "cpu"]

# Torch arrives as a transitive dependency of demucs. PyPI ships the CUDA build
# by default, which is ~2 GB of libraries a machine without an NVIDIA GPU never
# loads. Pull the CPU wheels instead; GPU users install torch themselves.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# cu126 rather than a newer index, for two independent reasons, both checked
# against download.pytorch.org:
#   1. It is one of only two indexes publishing BOTH torch 2.13.0 and
#      torchaudio 2.11.0 for cp311/win_amd64 - the pair the CPU side already
#      locks. cu128 stops at torch 2.11.0 and cu132 ships torch 2.13.0 with no
#      matching torchaudio at all.
#   2. Of those two it is the only one that still has kernels for pre-Turing
#      cards: PyTorch builds cu126 for 5.0;6.0;6.1;7.0;7.5;8.0;8.6;9.0 and
#      cu130 for 7.5 upwards, because CUDA 13 removed Maxwell, Pascal and
#      Volta. Release wheels are SASS-only, so a missing architecture cannot be
#      JIT-compiled from PTX - it fails at the first kernel launch. The most
#      common 4 GB NVIDIA card is a GTX 1050/1050 Ti, which is 6.1.
# cu126 also asks less of the driver, and the only thing cu130 adds is
# Blackwell, where no 4 GB card exists.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# Do NOT add `torch-backend` here: uv accepts the key silently but only `uv pip`
# respects it, so it would have no effect on `uv sync` or `uv lock`.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
]
torchaudio = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
]

[project.scripts]
song2midi = "song2midi.cli:main"

[dependency-groups]
dev = ["pytest"]
# torch and torchaudio live here rather than in [project.dependencies]: a
# [tool.uv.sources] entry gated on `group = ...` only applies while that group
# is enabled, so a plain project dependency cannot be routed per-variant - uv
# rejects it with "Requirements contain conflicting indexes for package torch".
# Both groups carry identical specifiers; only the index differs.
#
# torchaudio has to be listed alongside torch in both, and this is the trap: its
# wheels declare no Requires-Dist at all - not even on torch - so nothing stops
# the resolver pairing a CUDA torch with a CPU torchaudio, which dies at
# `import torchcrepe` on a missing libtorch_cuda.
#
# The floor keeps the resolver from walking backwards through every
# torch/torchaudio pair, downloading a ~200 MB wheel each time.
cpu = ["torch>=2.6", "torchaudio>=2.6"]
cu126 = ["torch>=2.6", "torchaudio>=2.6"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: loads models or processes real audio"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["song2midi"]
