[project]
name = "song2midi"
version = "0.1.0"
description = "Transcribe a full song into a multitrack MIDI file"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "soundfile",
    "librosa",
    "pretty_midi",
    "basic-pitch[onnx]>=0.4.0",
    "setuptools<81",
    "demucs>=4.1.0",
    "torchcrepe>=0.0.24",
    # torchaudio releases are pinned to matching torch releases. Without a floor
    # the resolver walks backwards through every pair, downloading a ~200 MB
    # wheel each time.
    "torch>=2.6",
    "torchaudio>=2.6",
]

[project.optional-dependencies]
gpu = []

[tool.uv]
# basic-pitch 0.4.0 hard-requires TensorFlow on Linux/py3.11, but it selects its
# backend with a try/except at import time and ships an ONNX copy of the model.
# With TF absent it uses onnxruntime, which is ~2 GB smaller and loads faster.
override-dependencies = ["tensorflow; sys_platform == 'never'"]
# resampy <0.4.3 (pinned by basic-pitch) imports pkg_resources, removed in
# setuptools 81.
constraint-dependencies = ["setuptools<81"]
# demucs caps torch at <2.3 on Intel Macs only. Resolving for that platform
# drags the whole project back to torch 2.2; exclude it rather than pin everyone
# else to a 2024 release. Apple Silicon, Linux and Windows are unaffected.
environments = ["sys_platform != 'darwin' or platform_machine != 'x86_64'"]

# Torch arrives as a transitive dependency of demucs. PyPI ships the CUDA build
# by default, which is ~2 GB of libraries a machine without an NVIDIA GPU never
# loads. Pull the CPU wheels instead; GPU users install torch themselves.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[project.scripts]
song2midi = "song2midi.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: loads models or processes real audio"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["song2midi"]
