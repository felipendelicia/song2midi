name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the release job widens this, so a PR build can
# never write to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes get cancelled; a tag build never does, because that
  # one produces a release artifact.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned rather than "latest": uv's sync semantics (in particular the pruning
  # of packages the lockfile does not mention) decide whether the PyInstaller
  # install below survives to the build step.
  UV_VERSION: "0.11.21"
  PYTHON_VERSION: "3.11"
  PYINSTALLER_VERSION: "6.21.0"
  ARTIFACT_NAME: song2midi-windows-x64

jobs:
  # Linux is the platform the project actually runs on today. Keeping it in the
  # same workflow means a Windows-motivated change that breaks Linux fails the
  # PR instead of being discovered later.
  linux-tests:
    name: tests (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked environment
        run: uv sync --locked

      # pyproject sets addopts = "-m 'not slow'", so this is already the fast
      # subset: no model loads, no downloads.
      - name: Run the fast test suite
        run: uv run --no-sync pytest -q

  windows-build:
    name: build exe (windows)
    runs-on: windows-latest
    # A cold uv sync pulls ~344 MB of wheels (122 MB of it torch), and
    # PyInstaller's analysis of torch is the slowest single step in the
    # workflow. 90 minutes is generous on purpose: a timeout here reads as a
    # flake, not as a signal.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # Defender scans every file PyInstaller writes into build/ and dist/,
      # which is tens of thousands of files. Excluding the two directories the
      # build touches is the single cheapest speedup on a Windows runner.
      # Non-fatal: if the runner image ever stops granting this, carry on.
      - name: Exclude the build directories from Defender
        continue-on-error: true
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "${{ runner.temp }}"

      # Deliberately not uv's managed CPython. uv would happily download a
      # python-build-standalone 3.11 and the environment would resolve exactly
      # the same, but PyInstaller is the one tool in this workflow that cares
      # which CPython build it is freezing, and the hosted-tool-cache CPython
      # is the configuration PyInstaller is tested against. It costs ~10 s.
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # The uv cache holds the wheels and their unpacked copies, so this is
          # also the torch download cache: the win_amd64 CPU wheel alone is
          # 122 MB off download.pytorch.org on every cold run. setup-uv puts it
          # under RUNNER_TEMP on hosted runners, i.e. the same drive as the
          # workspace, which is what lets uv hardlink instead of copy.
          cache-dependency-glob: uv.lock

      # --locked fails instead of re-resolving. The lockfile already covers
      # Windows: [tool.uv] environments is
      # "sys_platform != 'darwin' or platform_machine != 'x86_64'", which is
      # true on win32, and every package in the resulting install set has a
      # win_amd64 or py3-none-any wheel - no compiler needed on the runner.
      - name: Install the locked environment
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv sync --locked

      - name: Run the fast test suite
        run: uv run --no-sync pytest -q

      # After uv sync, never before: uv sync is exact and removes anything the
      # lockfile does not mention, PyInstaller included. Every later uv run
      # carries --no-sync for the same reason.
      - name: Add PyInstaller to the environment
        run: uv pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"

      # PyInstaller never chdir's to the spec's directory: paths written inside
      # the spec (the entry script, runtime hooks) resolve against the working
      # directory, which is the repo root here. distpath/workpath are passed
      # explicitly so the output location does not depend on where the spec
      # happens to live.
      - name: Build the executable
        run: >
          uv run --no-sync pyinstaller packaging/song2midi.spec
          --noconfirm --clean --log-level WARN
          --distpath dist --workpath build

      - name: Show what PyInstaller could not resolve
        if: always()
        shell: pwsh
        run: |
          $warn = Get-ChildItem -Path build -Filter 'warn-*.txt' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($warn) {
            Write-Host "::group::$($warn.Name)"
            Select-String -Path $warn.FullName -Pattern '^missing module' |
              Select-Object -First 60 | ForEach-Object { $_.Line }
            Write-Host '::endgroup::'
          }

      # beat_this pulls a 77 MB checkpoint from a university WebDAV host on
      # first use (torch.hub, under TORCH_HOME). Restore and save are split so
      # a failed smoke test cannot write an empty directory under the exact
      # key and poison it until uv.lock changes.
      - name: Restore the beat_this checkpoint
        id: torch-home
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/torch-home
          key: torch-home-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: torch-home-${{ runner.os }}-

      # The step that decides whether this workflow is worth having. Everything
      # above proves the code imports; this proves the frozen bundle actually
      # transcribes: onnxruntime loads nmp.onnx out of the bundle, numba/llvmlite
      # survive freezing, soundfile finds libsndfile, and torch initialises.
      - name: Smoke-test the executable
        shell: pwsh
        env:
          TORCH_HOME: ${{ runner.temp }}/torch-home
        run: |
          $ErrorActionPreference = 'Stop'
          # PowerShell 7.4+ turns a non-zero native exit code into a terminating
          # error under ErrorActionPreference=Stop. Turning that off keeps the
          # explicit $LASTEXITCODE checks below in charge, so Pop-Location still
          # runs and the failure message says which command failed.
          $PSNativeCommandUseErrorActionPreference = $false

          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\song2midi\song2midi.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "no executable at $exe" }

          $work = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $wav = Join-Path $work 'tone.wav'
          $mid = Join-Path $work 'tone.mid'

          # Standard library only, so the same script runs on a machine that
          # has no project environment (see the clean-runner job).
          python .github\scripts\make_tone.py $wav 3
          if ($LASTEXITCODE -ne 0) { throw 'could not generate the test tone' }

          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }

          # Run from outside the repo with the interpreter's environment
          # cleared: if the bundle silently leans on the build tree or on the
          # uv venv, it fails here rather than on a user's machine.
          Remove-Item Env:PYTHONHOME, Env:PYTHONPATH, Env:VIRTUAL_ENV -ErrorAction SilentlyContinue
          Push-Location $work
          & $exe $wav --no-separate --no-cache --device cpu -o $mid
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "song2midi.exe exited $code" }

          # Parses the SMF by hand: header, track count, and note-on events.
          # --no-separate routes the whole mix through Basic Pitch, so a file
          # with zero notes means the ONNX model did not run even though the
          # process exited 0.
          python .github\scripts\check_midi.py $mid --min-tracks 2 --min-notes 1
          if ($LASTEXITCODE -ne 0) { throw 'the produced .mid did not validate' }

      # Only now that the bundle is known to work. A poisoned cache would make
      # every later run fall back to librosa without anyone noticing.
      - name: Save the beat_this checkpoint
        if: steps.torch-home.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/torch-home
          key: torch-home-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Zip the bundle
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } else {
            "0.0.0+$($env:GITHUB_SHA.Substring(0, 7))"
          }
          $zip = "song2midi-$version-windows-x64.zip"
          # 7z, not Compress-Archive: this is ~1 GB of small files and
          # Compress-Archive is single-threaded and dramatically slower.
          # The directory is archived, not its contents, so unzipping produces
          # a song2midi\ folder instead of spraying files into the cwd.
          7z a -tzip -mx=5 -mmt=on "dist\$zip" ".\dist\song2midi" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z exited $LASTEXITCODE" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip=dist/$zip"
          Get-Item "dist\$zip" | Select-Object Name, Length | Format-List

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.package.outputs.zip }}
          # Already a zip; do not spend minutes deflating it a second time.
          # upload-artifact still wraps it in an outer archive, so the Actions
          # UI hands you a zip containing a zip. download-artifact unwraps it,
          # which is all the release job needs.
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  # Runs the exe on a runner where Python 3.11, uv and the project environment
  # were never installed. Not a pristine Windows box - the runner image still
  # ships a Python 3.12 and the VC++ redistributables - but it catches a bundle
  # that only works next to its own build tree. Gated on tags and manual runs
  # because it costs an artifact round-trip of about a gigabyte.
  windows-smoke-clean:
    name: smoke test on a clean runner (windows)
    needs: windows-build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Only for .github/scripts; nothing here builds or installs.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/download

      - name: Unpack and run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $zip = Get-ChildItem -Path "$env:RUNNER_TEMP\download" -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'no zip in the downloaded artifact' }

          $root = Join-Path $env:RUNNER_TEMP 'unpacked'
          7z x "$($zip.FullName)" "-o$root" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z exited $LASTEXITCODE" }

          $exe = Join-Path $root 'song2midi\song2midi.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "no executable at $exe" }

          $work = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $wav = Join-Path $work 'tone.wav'
          $mid = Join-Path $work 'tone.mid'

          # The runner's own Python (3.12 at time of writing). These two scripts
          # are standard library only precisely so this works.
          python .github\scripts\make_tone.py $wav 3
          if ($LASTEXITCODE -ne 0) { throw 'could not generate the test tone' }

          Push-Location $work
          & $exe $wav --no-separate --no-cache --device cpu -o $mid
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "song2midi.exe exited $code" }

          python .github\scripts\check_midi.py $mid --min-tracks 2 --min-notes 1
          if ($LASTEXITCODE -ne 0) { throw 'the produced .mid did not validate' }

  release:
    name: attach the exe to the release
    needs: [linux-tests, windows-build, windows-smoke-clean]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job in this workflow that can write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Windows build: unzip and run `song2midi.exe`.

            The executable is unsigned, so SmartScreen will warn on first run.
            `.mp3` and `.m4a` inputs still need `ffmpeg` on PATH; `.wav` and
            `.flac` do not.
